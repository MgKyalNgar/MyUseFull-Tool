        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Space Grotesk', sans-serif;
        }

        body {
            /* ပိုထင်ရှားသော Techno Background */
            background-color: #040812;
            background-image: 
                linear-gradient(to right, rgba(0, 243, 255, 0.08) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 243, 255, 0.08) 1px, transparent 1px),
                radial-gradient(circle at 50% 0%, rgba(0, 243, 255, 0.15) 0%, transparent 60%);
            background-size: 30px 30px, 30px 30px, 100% 100%;
            background-attachment: fixed;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 15px 0 15px; /* အောက်ခြေမှာ Footer ရှိလို့ Padding ချိန်ထားသည် */
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
            max-width: 800px;
        }

        h1 {
            /* ဖုန်းစခရင်မ်အရွယ်အစားပေါ်မူတည်ပြီး အလိုလို ကြီး/ငယ် ဖြစ်စေရန် clamp() ကို သုံးထားသည် */
            font-size: clamp(1.4rem, 6vw, 2.2rem); 
            text-transform: capitalize;
            /* စာလုံးအကွာအဝေးကိုလည်း စခရင်မ်အလိုက် အလိုလို ချိန်ညှိပေးမည် */
            letter-spacing: clamp(1px, 1.5vw, 3px); 
            margin-bottom: 8px;
            color: #00f3ff;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.5), 0 0 30px rgba(0, 243, 255, 0.2);
            /* စာလုံး ရှည်လွန်းပါက အောက်တစ်ကြောင်းသို့ ဆင်းစေရန် */
            word-wrap: break-word; 
            text-align: center;
        }

        .subtitle {
            color: #64748b;
            font-size: 0.95rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* ----- Main Container ----- */
        .main-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            flex: 1; /* Footer ကို အောက်ဆုံးရောက်စေရန် */
        }

        /* ----- Category Header ----- */
        .category-header {
            margin: 30px 0 15px 0;
            color: #8b9bb4;
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px dashed #1e293b;
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ----- Grid Layout (Compact) ----- */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            width: 100%;
        }

        /* ----- Compact Horizontal Card Design ----- */
        .app-card {
            background: rgba(10, 15, 25, 0.85);
            border: 1px solid #1e293b;
            border-left: 4px solid var(--theme-color);
            border-radius: 8px;
            padding: 15px;
            text-decoration: none;
            display: flex;
            flex-direction: row;
            align-items: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
            position: relative;
            overflow: hidden;
        }

        .app-card:hover {
            transform: translateX(5px);
            background: rgba(15, 22, 35, 0.95);
            border-color: var(--theme-color);
            box-shadow: 0 0 15px calc(var(--theme-color) + 33), inset 0 0 10px calc(var(--theme-color) + 11);
        }

        .card-icon {
            font-size: 2rem;
            margin-right: 15px;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.2));
            transition: transform 0.3s ease;
        }

        .app-card:hover .card-icon {
            transform: scale(1.1);
        }

        .card-content {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            color: #f8fafc;
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .card-desc {
            color: #8b9bb4;
            font-size: 0.8rem;
            line-height: 1.3;
        }

        /* Tech Arrow Indicator */
        .go-icon {
            color: var(--theme-color);
            font-size: 1.5rem;
            font-weight: bold;
            opacity: 0.5;
            transition: all 0.3s ease;
            margin-left: 10px;
        }

        .app-card:hover .go-icon {
            opacity: 1;
            transform: translateX(3px);
            text-shadow: 0 0 10px var(--theme-color);
        }

                /* ----- Footer ----- */
        .footer {
            margin-top: 50px;
            padding: 20px;
            width: 100%;
            text-align: center;
            color: #475569;
            font-size: 0.9rem;
            letter-spacing: 1px;
            border-top: 1px solid rgba(30, 41, 59, 0.5);
            background: rgba(4, 8, 18, 0.8);
            backdrop-filter: blur(5px);

        function getSelected() {
            const params = new URLSearchParams(location.search);
            const tools = (params.get('tool') || '').split(',').filter(Boolean);
            const topics = (params.get('topic') || '').split(',').filter(Boolean);
            return { tools, topics };
        }

        function matches(app, sel) {
            const toolOk = sel.tools.length === 0 || (app.tool && sel.tools.includes(app.tool));
            const topicOk = sel.topics.length === 0 || (app.topics || []).some(t => sel.topics.includes(t));
            return toolOk && topicOk;
        }

        function renderHub() {
            const sel = getSelected();
            const mainContainer = document.getElementById('main-container');
            mainContainer.innerHTML = '';
            const filtered = promptApps.filter(app => matches(app, sel));

            const groupedApps = filtered.reduce((acc, app) => {
                if (!acc[app.category]) {
                    acc[app.category] = [];
                }
                acc[app.category].push(app);
                return acc;
            }, {});

            for (const [category, apps] of Object.entries(groupedApps)) {
                const header = document.createElement('div');
                header.className = 'category-header';
                header.innerText = category;
                mainContainer.appendChild(header);

                const grid = document.createElement('div');
                grid.className = 'grid-container';

                apps.forEach(app => {
                    const card = document.createElement('a');
                    card.href = app.url;
                    card.className = 'app-card';
                    card.style.setProperty('--theme-color', app.theme);

                    card.innerHTML = `
                        <div class="card-icon">${app.icon}</div>
                        <div class="card-content">
                            <div class="card-title">${app.title}</div>
                            <div class="card-desc">${app.desc}</div>
                        </div>
                        <div class="go-icon">›</div>
                    `;
                    grid.appendChild(card);
                });

                mainContainer.appendChild(grid);
            }

            const oldToolsLinkContainer = document.createElement('div');
            oldToolsLinkContainer.className = 'my-camera-tool';

            const linkAnchor = document.createElement('a');
            linkAnchor.href = "Old Tools index.html";
            linkAnchor.innerText = "My Camera Tools";

            oldToolsLinkContainer.appendChild(linkAnchor);
            mainContainer.appendChild(oldToolsLinkContainer);
        }

        renderHub();
